name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install flet
        pip install requests httpx
    
    - name: Setup Flutter with subosito
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Build APK
      run: |
        flet build apk
      env:
        FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable/3.16.0/x64
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: arzshenas-apk
        path: build/apk/*.apk
